<div class="avatar" [class]="sizeClass">
  <img *ngIf="photo" [src]="photo" [alt]="name" class="avatar-image">
  <div *ngIf="!photo && name && name !== 'Invitado'" class="avatar-placeholder">{{ initial }}</div>
  <svg *ngIf="!photo && (!name || name === 'Invitado')" class="avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
    <circle cx="12" cy="7" r="4"/>
  </svg>
</div>
