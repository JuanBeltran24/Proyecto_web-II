<div class="client-menu">
  <button
    type="button"
    class="menu-trigger"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="menu"
    aria-label="Menú de mi perfil">
    <app-client-avatar [photo]="photo" [name]="displayName" size="header"></app-client-avatar>
  </button>
  
  <div *ngIf="isOpen" class="menu-dropdown" role="menu">
    <div class="menu-header">
      <app-client-avatar [photo]="photo" [name]="displayName" size="medium"></app-client-avatar>
      <div class="menu-header-info">
        <span class="menu-name">{{ displayName }}</span>
        <span class="menu-label">Cliente</span>
      </div>
    </div>
    
    <div class="menu-divider"></div>
    
    <button
      type="button"
      class="menu-item"
      role="menuitem"
      (click)="navigateTo('datos')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Mi perfil</span>
    </button>
    
    <button
      type="button"
      class="menu-item"
      role="menuitem"
      (click)="navigateTo('solicitudes')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
      </svg>
      <span>Mis solicitudes</span>
    </button>
  </div>
</div>
