<div class="notification-bell-container" [class.variant-dark]="variant === 'dark'">
  <!-- Botón de campana -->
  <button 
    class="notification-bell-button"
    (click)="togglePanel()"
    [attr.aria-label]="'Notificaciones' + ((unreadCount$ | async) ? ' (' + (unreadCount$ | async) + ' nuevas)' : '')"
    type="button">
    <svg class="bell-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 22C13.1 22 14 21.1 14 20H10C10 21.1 10.89 22 12 22ZM18 16V11C18 7.93 16.36 5.36 13.5 4.68V4C13.5 3.17 12.83 2.5 12 2.5C11.17 2.5 10.5 3.17 10.5 4V4.68C7.63 5.36 6 7.92 6 11V16L4 18V19H20V18L18 16Z" fill="currentColor"/>
    </svg>
    <span class="badge" *ngIf="(unreadCount$ | async) as count">{{ count > 99 ? '99+' : count }}</span>
  </button>

  <!-- Panel de notificaciones -->
  <div class="notification-panel" *ngIf="isOpen" role="dialog" aria-label="Panel de notificaciones">
    
    <!-- Vista de ajustes -->
    <ng-container *ngIf="showSettings">
      <div class="panel-header">
        <button class="back-button" (click)="toggleSettings()" aria-label="Volver">
          ← Volver
        </button>
        <h3>Ajustes de notificaciones</h3>
      </div>

      <div class="settings-content">
        <div class="setting-item">
          <label>
            <input 
              type="checkbox" 
              [checked]="prefs.toasts"
              (change)="updateToasts($any($event.target).checked)">
            <span>Mostrar toasts</span>
          </label>
          <p class="setting-description">Muestra notificaciones emergentes en la esquina de la pantalla</p>
        </div>
      </div>
    </ng-container>

    <!-- Vista principal de notificaciones -->
    <ng-container *ngIf="!showSettings">
      <div class="panel-header">
        <!-- Fila 1: Título y engranaje -->
        <div class="header-row-1">
          <h3>Notificaciones</h3>
          <button 
            class="icon-button" 
            (click)="toggleSettings()"
            aria-label="Ajustes">
            ⚙️
          </button>
        </div>

        <!-- Fila 2: Botones de acción (solo cuando hay notificaciones) -->
        <div class="header-row-2" *ngIf="(notifications$ | async) as notifications" [hidden]="notifications.length === 0">
          <!-- Estado normal: botones de acción -->
          <div class="action-buttons" *ngIf="!showClearConfirm && !clearActionMessage">
            <button 
              class="action-button mark-read-button" 
              (click)="markAllAsRead()"
              [disabled]="(unreadCount$ | async) === 0"
              [attr.aria-label]="'Marcar ' + (unreadCount$ | async) + ' como leídas'">
              <svg class="button-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M13.3334 4L6.00002 11.3333L2.66669 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M13.3334 8L10.6667 10.6667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Marcar todas como leídas</span>
            </button>
            <button 
              class="action-button clear-button" 
              (click)="showClearAllConfirmation()"
              type="button"
              aria-label="Limpiar todas las notificaciones">
              <svg class="button-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M2 4H14M5.33333 4V2.66667C5.33333 2.29848 5.63181 2 6 2H10C10.3682 2 10.6667 2.29848 10.6667 2.66667V4M12.6667 4V13.3333C12.6667 13.7015 12.3682 14 12 14H4C3.63181 14 3.33333 13.7015 3.33333 13.3333V4H12.6667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6.66667 7.33334V10.6667M9.33333 7.33334V10.6667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Limpiar todo</span>
            </button>
          </div>

          <!-- Estado de confirmación -->
          <div 
            class="clear-confirmation" 
            *ngIf="showClearConfirm"
            role="group"
            aria-label="Confirmación de borrado">
            <p class="confirm-text">¿Borrar todas las notificaciones?</p>
            <div class="confirm-buttons">
              <button 
                class="clear-cancel-button" 
                (click)="cancelClearAll()"
                type="button"
                aria-label="Cancelar">
                Cancelar
              </button>
              <button 
                class="clear-confirm-button" 
                (click)="confirmClearAll()"
                type="button"
                aria-label="Sí, borrar todas las notificaciones">
                Sí, borrar
              </button>
            </div>
          </div>

          <!-- Mensaje de resultado -->
          <div 
            class="clear-result-message" 
            *ngIf="clearActionMessage"
            role="status"
            aria-live="polite">
            {{ clearActionMessage }}
          </div>
        </div>
      </div>

      <!-- Lista de notificaciones con scroll -->
      <div class="notifications-list">
        <ng-container *ngIf="(notifications$ | async) as notifications">
          <!-- Lista de notificaciones -->
          <div 
            *ngFor="let notif of notifications"
            class="notification-item"
            [class.unread]="!notif.read"
            (click)="openNotification(notif)"
            role="button"
            tabindex="0"
            [attr.aria-label]="notif.title + '. ' + notif.body"
            (keydown.enter)="openNotification(notif)"
            (keydown.space)="openNotification(notif); $event.preventDefault()">
            
            <div class="notif-icon">{{ getIcon(notif) }}</div>
            
            <div class="notif-content">
              <div class="notif-title">{{ notif.title }}</div>
              <div class="notif-message">{{ notif.body }}</div>
              <div class="notif-time">{{ formatTime(notif.createdAt) }}</div>
            </div>
            
            <button 
              class="remove-button"
              (click)="removeNotification($event, notif.id)"
              aria-label="Eliminar notificación">
              ×
            </button>
          </div>

          <!-- Estado vacío -->
          <div class="empty-state" *ngIf="notifications.length === 0">
            <div class="empty-icon">🔕</div>
            <p>No tienes notificaciones</p>
          </div>
        </ng-container>
      </div>
    </ng-container>
  </div>
</div>
