<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<main class="auth-layout">
  <section class="auth-panel register-panel">
    <div class="panel-heading">
      <div class="heading-text">
        <h2>
          <span class="title">Crear cuenta</span>
          <span class="badge">GRATIS</span>
        </h2>
        <p class="intro">
          Únete a nuestra plataforma y comienza a conectar con los mejores profesionales sin costo alguno
        </p>
      </div>

      <svg class="heading-illustration" viewBox="0 0 80 80" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="20" y="15" width="40" height="50" rx="4"/>
          <path d="M30 15v-3a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v3"/>
          <line x1="28" y1="28" x2="52" y2="28"/>
          <line x1="28" y1="38" x2="48" y2="38"/>
          <line x1="28" y1="48" x2="42" y2="48"/>
          <circle cx="60" cy="55" r="15" fill="#fff" stroke-width="2"/>
          <path d="m52 55 5 5 10-10" stroke-width="2.5"/>
        </g>
      </svg>
    </div>

    <form class="auth-form" (ngSubmit)="onRegister()" novalidate>
      <div class="form-grid">
        <!-- Nombre completo -->
        <div class="form-group">
          <label class="field-label" for="fullName">Nombre completo</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <circle cx="12" cy="10" r="3"/>
              <path d="M6.2 18.2c1.4-2.1 3.4-3.2 5.8-3.2s4.4 1.1 5.8 3.2"/>
            </svg>
            <input
              id="fullName"
              type="text"
              name="fullName"
              class="form-control"
              placeholder="Ingresa tu nombre"
              autocomplete="name"
              required
              [(ngModel)]="formData.fullName">
          </div>
        </div>

        <!-- Correo electrónico -->
        <div class="form-group">
          <label class="field-label" for="email">Correo electrónico</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3 7 9 6 9-6"/>
            </svg>
            <input
              id="email"
              type="email"
              name="email"
              class="form-control"
              placeholder="ejemplo@gmail.com"
              autocomplete="email"
              required
              [(ngModel)]="formData.email">
          </div>
        </div>

        <!-- Teléfono (opcional) -->
        <div class="form-group">
          <label class="field-label" for="phone">Teléfono (opcional)</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
            </svg>
            <input
              id="phone"
              type="tel"
              name="phone"
              class="form-control"
              placeholder="Ingresa tu teléfono"
              autocomplete="tel"
              [(ngModel)]="formData.phone">
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label class="field-label" for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              class="form-control"
              placeholder="Crea tu contraseña"
              autocomplete="new-password"
              required
              [(ngModel)]="formData.password">
            <button
              class="show-password-btn"
              type="button"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg viewBox="0 0 24 24" aria-hidden="true" *ngIf="!showPassword">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg viewBox="0 0 24 24" aria-hidden="true" *ngIf="showPassword">
                <path d="M17.9 17.9A10.5 10.5 0 0 1 12 19C5.5 19 2 12 2 12a18 18 0 0 1 4.1-5.1M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2"/>
                <path d="M14.1 14.1A3 3 0 0 1 9.9 9.9"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirmar contraseña -->
        <div class="form-group form-group-full">
          <label class="field-label" for="confirmPassword">Confirmar contraseña</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input
              id="confirmPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              name="confirmPassword"
              class="form-control"
              [class.is-invalid]="passwordsMismatch"
              placeholder="Confirma tu contraseña"
              autocomplete="new-password"
              required
              [(ngModel)]="formData.confirmPassword">
            <button
              class="show-password-btn"
              type="button"
              (click)="toggleConfirmPassword()"
              [attr.aria-label]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg viewBox="0 0 24 24" aria-hidden="true" *ngIf="!showConfirmPassword">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg viewBox="0 0 24 24" aria-hidden="true" *ngIf="showConfirmPassword">
                <path d="M17.9 17.9A10.5 10.5 0 0 1 12 19C5.5 19 2 12 2 12a18 18 0 0 1 4.1-5.1M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2"/>
                <path d="M14.1 14.1A3 3 0 0 1 9.9 9.9"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
          <span class="field-error" *ngIf="passwordsMismatch">Las contraseñas no coinciden</span>
        </div>
      </div>

      <!-- Términos y condiciones -->
      <label class="checkbox-group">
        <input
          type="checkbox"
          name="acceptTerms"
          required
          [(ngModel)]="formData.acceptTerms">
        <span>Acepto los <a href="#">Términos y condiciones</a> y la <a href="#">Política de privacidad</a></span>
      </label>

      <!-- Botones principales -->
      <button
        class="btn btn-primary"
        type="submit"
        [disabled]="!isFormValid()">
        Crear cuenta gratis
      </button>

      <button
        class="btn btn-primary"
        type="button"
        routerLink="/register-professional">
        Crear cuenta gratis para profesionales
      </button>

      <!-- Separador -->
      <div class="separator">
        <span>o continuar con</span>
      </div>

      <!-- Botones sociales -->
      <div class="social-buttons">
        <button type="button" class="btn btn-social">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.63h6.45a5.51 5.51 0 0 1-2.39 3.62v3h3.87c2.27-2.09 3.57-5.17 3.57-8.8z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3c-1.07.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.09A12 12 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.28a7.2 7.2 0 0 1 0-4.56V6.63H1.27a12 12 0 0 0 0 10.74l4-3.09z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.63l4 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
          </svg>
          Continuar con Google
        </button>

        <button type="button" class="btn btn-social">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M16.37 1.43c0 1.14-.46 2.22-1.2 3.01-.8.86-2.1 1.52-3.16 1.43-.13-1.1.41-2.25 1.15-3 .83-.86 2.2-1.5 3.21-1.44zM20.5 17.1c-.55 1.27-.82 1.84-1.53 2.96-.99 1.57-2.39 3.52-4.12 3.54-1.54.02-1.94-1-4.03-.99-2.09.01-2.53 1.01-4.07.99-1.73-.02-3.05-1.78-4.04-3.35C-.04 15.9-.33 10.7 1.4 8.05c1.22-1.88 3.15-2.98 4.97-2.98 1.85 0 3.01 1.01 4.54 1.01 1.48 0 2.38-1.01 4.52-1.01 1.62 0 3.34.88 4.56 2.4-4 2.19-3.35 7.9.51 9.63z"/>
          </svg>
          Continuar con Apple
        </button>
      </div>
    </form>

    <!-- Nota de seguridad -->
    <div class="footer-note">
      <svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="3.5"/>
        <path d="M2.5 20v-1.5A4.5 4.5 0 0 1 7 14h2"/>
        <rect x="13" y="15" width="8" height="6" rx="1.5"/>
        <path d="M15 15v-1.5a2 2 0 0 1 4 0V15"/>
      </svg>
      <span>Tus datos están protegidos y están 100% seguros</span>
    </div>
  </section>
</main>
